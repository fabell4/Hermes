# Jekyll configuration for Hermes Docs

title: Hermes Documentation
description: Self-hosted internet speed test monitoring with modern observability stack integration
url: https://hermes-docs.greenflametech.com
baseurl: ""

favicon: /assets/Hermes.png

# Top navbar links
nav_links:
  - title: Home
    url: /
  - title: Getting Started
    url: /getting-started
  - title: API Reference
    url: /api-reference
  - title: Security
    url: /security

# Footer links
footer:
  github: https://github.com/fabell4/Hermes
  linkedin: https://www.linkedin.com/in/alex-bell-iv
  main_site: https://www.greenflametech.com

# GitHub metadata
repository: fabell4/Hermes

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-github-metadata
  - jekyll-relative-links

# Include files
include:
  - SECURITY-AUDIT.md
  - SECURITY-ENHANCEMENTS.md
  - RELEASE-PROCESS.md

# Exclude from build
exclude:
  - zeniscal.yml
  - Gemfile
  - Gemfile.lock
  - grafana-dashboard.json
  - "*.json"

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - Gemfile.lock
  - grafana-dashboard.json
  - suppression-decisions.md
  - zeniscal.yml
